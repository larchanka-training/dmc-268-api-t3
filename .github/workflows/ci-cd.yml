name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      # Same hooks as the local git hook: ruff, ruff format, mypy, pylint, whitespace.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: infra/apply.sh fmt -check -diff
      - run: infra/apply.sh init -backend=false -input=false -no-color
      - run: infra/apply.sh validate -no-color

  compose:
    name: docker compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl -fsS http://localhost:8000/healthcheck
      - run: docker compose exec -T api python -m app.worker.smoke
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  image:
    name: Build and push image
    needs: [checks, terraform, compose]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      # The gha cache export needs buildx's docker-container driver.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: http://${{ vars.VPS_DMC268_IP_T3 }}/
    # Never cancel a running apply: it would leave containers half-replaced.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.VPS_DMC268_IP_T3 }}
      APP_DIR: /opt/dmc268
      IMAGE_REF: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 .github/ssh/known_hosts ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      # Newer than this commit's tip of main? Then a later merge already deployed
      # (or will deploy) a newer version; applying this one would roll it back.
      - name: Skip if a newer commit exists on main
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::${GITHUB_SHA} is no longer the tip of main (${tip}); skipping this deploy."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # A throwaway DOCKER_CONFIG keeps the short-lived token off the server's disk.
      # Pulled before anything is staged, so Terraform finds the image locally.
      - name: Pull image on the server
        if: steps.fresh.outputs.stale != 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh deploy-target "set -e
            export DOCKER_CONFIG=\$(mktemp -d)
            trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT
            docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null
            docker pull -q '$IMAGE_REF'"

      # Files go to a per-run staging dir; deploy.sh promotes them to the live
      # config inside the server-side lock, so nothing changes outside it.
      - name: Stage config and secrets
        if: steps.fresh.outputs.stale != 'true'
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          EUROROUTER_API_KEYS: ${{ secrets.AI_DMC268_T3 }}
          EUROROUTER_BASE_URL: ${{ vars.AI_DMC268_URL }}
        run: |
          set -euo pipefail
          : "${POSTGRES_PASSWORD:?repo secret POSTGRES_PASSWORD is not set}"
          STAGE="$APP_DIR/incoming/backend-$GITHUB_RUN_ID"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          ssh deploy-target "install -d -m 700 $APP_DIR/incoming && rm -rf $STAGE && install -d -m 700 $STAGE"
          # Tracked files only (keeps exec bits); server-side state is never touched.
          git archive --format=tar HEAD:infra | ssh deploy-target "tar -C $STAGE -xf -"
          # Secrets travel over stdin into a 0600 file, never as arguments.
          jq -n \
            --arg api_image "$IMAGE_REF" \
            --arg postgres_password "$POSTGRES_PASSWORD" \
            --arg eurorouter_api_keys "$EUROROUTER_API_KEYS" \
            --arg eurorouter_base_url "$EUROROUTER_BASE_URL" \
            '{api_image: $api_image, postgres_password: $postgres_password,
              eurorouter_api_keys: $eurorouter_api_keys, eurorouter_base_url: $eurorouter_base_url}' \
            | ssh deploy-target "umask 077 && cat > $STAGE/api.auto.tfvars.json"

      # deploy.sh: flock (shared with the frontend repo's deploy), config promotion,
      # migrations first, then the rest; restores the previous settings on failure.
      - name: terraform apply
        if: steps.fresh.outputs.stale != 'true'
        run: ssh deploy-target "$STAGE/deploy.sh $STAGE"

      - name: Show migration logs on failure
        if: failure()
        run: ssh deploy-target "docker logs --tail 100 dmc268-migrate" || true

      - name: Smoke test
        if: steps.fresh.outputs.stale != 'true'
        run: |
          set -euo pipefail
          curl -fsS --retry 20 --retry-delay 3 --retry-all-errors "http://${DEPLOY_HOST}/api/healthcheck"
          curl -fsS -o /dev/null "http://${DEPLOY_HOST}/"
          ssh deploy-target "docker exec dmc268-api python -m app.worker.smoke"

      # Hygiene only: in-use images are never pruned, and a week of old tags stays for rollback.
      - name: Prune old images
        if: steps.fresh.outputs.stale != 'true'
        continue-on-error: true
        # Docker Hub images (terraform, caddy, ...) are old by creation date but must
        # stay cached; only prune what this pipeline pushed.
        run: ssh deploy-target "docker images --format '{{.Repository}}:{{.Tag}} {{.CreatedSince}}' | grep '^ghcr.io/' | grep -E 'weeks|month|year' | cut -d' ' -f1 | xargs -r docker rmi" || true
